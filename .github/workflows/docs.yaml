name: Documentation

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - '**'

permissions: {}

concurrency:
  # Versioned docs update the same Git branch and Pages deployment, so publish
  # jobs must run one at a time. Do not cancel queued release-tag deploys.
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Release tags are published by the deploy job. This job keeps PR and master
    # docs checks fast without building the same tag twice.
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.14'
          cache: 'pip'
      - name: Install documentation dependencies
        run: make docs-install
      - name: Build versioned documentation
        run: |
          # Exercise the same `mike deploy` and export path used by releases,
          # but on a local throwaway branch with no push, alias, or default.
          VERSION=pr-preview \
          DOCS_DEPLOY_BRANCH=docs-preview \
          MIKE_FLAGS="--ignore-remote-status" \
          make docs-deploy

          DOCS_DEPLOY_BRANCH=docs-preview \
          DOCS_EXPORT_DIR=site-versioned \
          make docs-export

  deploy:
    # Only release tags publish docs. A master push validates docs but must not
    # move the `latest` alias or default version.
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # `mike` stores the complete versioned site on `gh-pages`.
      contents: write
      # GitHub Pages still publishes from this workflow's uploaded artifact.
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          # `mike` needs the existing `gh-pages` branch history so each release
          # adds one version without dropping older versions.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.14'
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - run: make docs-install
      - run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Build this tag into the version store, mark it as the only `latest`,
          # then export the full versioned site for GitHub Actions Pages.
          make docs-deploy VERSION="$VERSION" ALIASES=latest
          make docs-set-default DEFAULT_VERSION=latest PUSH=1
          make docs-export
        env:
          # Let `mike` push through git without writing the token into .git/config.
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: http.https://github.com/.extraheader
          GIT_CONFIG_VALUE_0: "AUTHORIZATION: bearer ${{ github.token }}"
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site-versioned
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
